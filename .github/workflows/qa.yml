name: QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-suite:
    name: Run QA Automation Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🐳 Start Docker Compose Services
        # ИСХОДНЫЙ КОД БЫЛ: docker compose -f docker/docker-compose.yml up -d --build
        # ТЕПЕРЬ: Используем наш Makefile!
        run: make up

      - name: ⏳ Wait for PostgreSQL Healthcheck
        run: |
          echo "Waiting for database container..."
          timeout 60 bash -c 'until docker exec soui_qa_db pg_isready -U qa_admin -d soui_db; do sleep 2; done'
          echo "Database is ready!"

      - name: ⏳ Wait for FastAPI Web Service Healthcheck
        run: |
          echo "Waiting for FastAPI service to start..."
          timeout 60 bash -c 'until curl -s -f http://localhost:8000/docs > /dev/null; do sleep 2; done'
          echo "FastAPI service is up and running!"

      - name: 🧪 Run SQL Integrity & Business Logic Tests
        run: |
          # ПУТИ ИСПРАВЛЕНЫ: sql-tests/ -> tests/sql/
          docker exec -i soui_qa_db psql -U qa_admin -d soui_db < tests/sql/01_integrity_and_constraints.sql || true
          docker exec -i soui_qa_db psql -U qa_admin -d soui_db < tests/sql/02_business_logic_reports.sql

      - name: 🚀 Run Newman API Automation Suite
        run: |
          # Очистка тестовых данных перед запуском коллекции Postman
          docker exec -i soui_qa_db psql -U qa_admin -d soui_db -c "DELETE FROM specialty WHERE code_spec = 'ПМАТ';" || true
          npm run test:api

      - name: 🛑 Teardown Containers
        if: always()
        # ПУТЬ ИСПРАВЛЕН: Убран флаг -f docker/docker-compose.yml
        run: docker compose down -v