name: QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-suite:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Newman
        run: npm install -g newman

      - name: 🐳 Start Docker Compose Services
        run: docker compose up -d --build

      - name: ⏳ Wait for PostgreSQL Healthcheck
        run: |
          echo "Waiting for database container..."
          timeout 60 bash -c 'until docker exec soui_qa_db pg_isready -U qa_admin -d soui_db; do sleep 2; done'
          echo "Database is ready!"

      - name: 🧪 Run SQL Integrity & Constraint Tests
        run: |
          docker exec -i soui_qa_db psql -U qa_admin -d soui_db < sql-tests/01_integrity_and_constraints.sql || true
          docker exec -i soui_qa_db psql -U qa_admin -d soui_db < sql-tests/02_business_logic_reports.sql

      - name: 🚀 Run Newman API Automation Suite
        run: |
          docker exec -i soui_qa_db psql -U qa_admin -d soui_db -c "DELETE FROM specialty WHERE code_spec = 'ПМАТ';" || true
          npx newman run tests/soui_postman_collection.json

      - name: 🛑 Teardown Containers
        if: always()
        run: docker compose down -v
