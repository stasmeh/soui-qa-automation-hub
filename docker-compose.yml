services:
  postgres-db:
    image: postgres:16-alpine
    container_name: soui_qa_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soui_db}
      POSTGRES_USER: ${POSTGRES_USER:-qa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - soui_pg_data:/var/lib/postgresql/data
      # ВАЖНО: Если папка init-db осталась внутри папки docker, 
      # измените этот путь на ./docker/init-db:/docker-entrypoint-initdb.d
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-qa_admin} -d $${POSTGRES_DB:-soui_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  soui-web-api:
    build:
      context: ./app # Исправлено: теперь указывает на папку рядом
      dockerfile: Dockerfile
    container_name: soui_web_service
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://qa_admin:qa_secure_password@postgres-db:5432/soui_db}
    volumes:
      - ./app:/app # Исправлено: теперь монтирует папку рядом
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  soui_pg_data: