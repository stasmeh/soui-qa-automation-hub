version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: soui_qa_db
    environment:
      POSTGRES_DB: soui_db
      POSTGRES_USER: qa_admin
      POSTGRES_PASSWORD: qa_secure_password
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d

  soui-web-api:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: soui_web_service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://qa_admin:qa_secure_password@postgres-db:5432/soui_db
    depends_on:
      - postgres-db
